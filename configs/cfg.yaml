# Explicit recipe, not a benchmark result. See README for formerly missing settings.
model:
  layers: 11
  hidden: 512
  heads: 8
  feedforward: 2048
  context: 512
  dropout: 0.1
vocab_size: 16384
device: cuda
training:
  microbatch_size: 2
  context: 512
  stride: 128
  accumulation: 32
  learning_rate: 0.0003
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight_decay: 0.01
  clip_norm: 1.0
  schedule: constant
  warmup_updates: 0
  decay_updates: 1000
  budget_policy: optimizer_steps
  budget_limit: 1000
  seed: 42
  fp16: true
  validation_interval: 100
  checkpoint_interval: 100
data:
  root: data/fineweb_v1
  tokenizer: data/fineweb_v1/tokenizers
  tier: smoke
evaluation:
  protocol: fineweb_document_eos_c256_s128_v1
  context: 256
  stride: 128
  eos_id: 0
checkpoint:
  output: checkpoints/dense
  resume: null
