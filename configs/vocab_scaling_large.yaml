# Template only: budget is a placeholder; prepare 16K/32K artifacts and freeze production budget before use.
model:
  layers: 10
  hidden: 512
  heads: 8
  feedforward: 2048
  context: 512
  dropout: 0.1
training:
  microbatch_size: 2
  context: 256
  stride: 128
  accumulation: 8
  learning_rate: 0.0003
  betas:
  - 0.9
  - 0.999
  epsilon: 1.0e-08
  weight_decay: 0.01
  clip_norm: 1.0
  schedule: constant
  budget_policy: flops
  budget_limit: 35000000000000
  seed: 42
  fp16: false
  validation_interval: 0
  checkpoint_interval: 25
  checkpoint_seconds: 300
  flop_estimator: vocab_scaling_v1
data:
  root: data/REQUIRES_PREPARED_LARGE_CORPUS
  tier: pilot
evaluation:
  protocol: fineweb_document_eos_c256_s128_v1
  context: 256
  stride: 128
  eos_id: 0
arms:
  baseline16k:
    vocab_size: 16384
    kind: dense
    tokenizer: null
  vocab32k:
    vocab_size: 32768
    kind: low_rank
    tokenizer: null
  vocab64k:
    vocab_size: 65536
    kind: low_rank
    tokenizer: null
    optional: true
baseline: baseline16k
device: cuda
output: results/vocab_scaling_large
evaluation_fractions:
- 0.25
- 0.5
- 0.75
- 1.0
diagnostic_fractions:
- 0.5
- 1.0
screen_documents: 8
confirmation_documents: 8
threads: 1
profile_updates: 7
profile_warmup: 3
