[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-lm-research"
version = "0.1.0"
description = "Small tied-embedding language models under explicit research budgets"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "numpy", "tokenizers>=0.22", "PyYAML", "pyarrow"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["vocab_lm*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
